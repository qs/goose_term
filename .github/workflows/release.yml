name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  GOOSE_VERSION: v2026.4

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        # One row per published archive. Goose's releases carry no checksum
        # file, so each archive's hash is pinned here; update it together with
        # GOOSE_VERSION.
        include:
          - target: linux-x86_64
            runner: ubuntu-22.04
            goose_archive: goose-v2026.4-linux-x64.tar.gz
            goose_sha256: 559ad7572df89fcd1273512d8679528bcdf876c252ec1f31608d3808b24125b3
            archive: goose-term-linux-x86_64.tar.gz
          - target: macos-arm64
            runner: macos-15
            goose_archive: goose-v2026.4-macos-arm64.tar.gz
            goose_sha256: 8ef0b5a864a719bd095b8376bed069d0edc77a0ce8f3cb9d59fdf87291a3a922
            archive: goose-term-macos-arm64.tar.gz
          - target: macos-x86_64
            runner: macos-15-intel
            goose_archive: goose-v2026.4-macos-x64.tar.gz
            goose_sha256: 471beefd5787ff96b68c1a059ac4de0973a86a540efda9f2b084b540b5d73db0
            archive: goose-term-macos-x86_64.tar.gz

    steps:
      - name: Check out the tagged source
        uses: actions/checkout@v4

      # Goose's own compiler cache holds the CMake build of SDL, Nuklear and
      # the gfx/ui native parts. Rebuilding those from scratch per tag was
      # most of a release's wall time.
      - name: Cache Goose's build cache
        uses: actions/cache@v4
        with:
          path: ~/.goose
          key: goose-cache-${{ runner.os }}-${{ env.GOOSE_VERSION }}
          restore-keys: |
            goose-cache-${{ runner.os }}-

      - name: Cache the Goose toolchain
        id: toolchain
        uses: actions/cache@v4
        with:
          path: toolchain
          key: goose-toolchain-${{ runner.os }}-${{ env.GOOSE_VERSION }}

      - name: Install the C compiler and X11/Wayland headers
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends build-essential libx11-dev libxext-dev

      - name: Make sure CMake and the Xcode tools are present
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          xcode-select -p
          command -v cmake > /dev/null || brew install cmake

      - name: Install the pinned Goose compiler
        if: steps.toolchain.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          archive="${{ matrix.goose_archive }}"
          mkdir -p toolchain
          cd toolchain
          curl --fail --location --show-error --remote-name \
            "https://github.com/aardappel/goose/releases/download/${GOOSE_VERSION}/${archive}"
          # macOS has shasum, not sha256sum; both read the same line format.
          printf '%s  %s\n' "${{ matrix.goose_sha256 }}" "${archive}" > "${archive}.sha256"
          if command -v sha256sum > /dev/null 2>&1; then
            sha256sum --check "${archive}.sha256"
          else
            shasum -a 256 --check "${archive}.sha256"
          fi
          tar --extract --gzip --file "${archive}"

      # Runs whether the toolchain was downloaded or restored from the cache.
      - name: Find the Goose compiler
        shell: bash
        run: |
          set -euo pipefail
          goose="$(find toolchain -type f -name goose -perm -111 -print -quit)"
          test -n "$goose"
          echo "GOOSE=$PWD/$goose" >> "${GITHUB_ENV}"

      - name: Check and build the terminal
        shell: bash
        run: |
          set -euo pipefail
          "$GOOSE" version
          "$GOOSE" check src/main.goose
          GOOSE="$GOOSE" ./build.sh

      - name: Package release assets
        shell: bash
        run: |
          set -euo pipefail
          archive="${{ matrix.archive }}"
          mkdir dist
          install -m 755 build/goose-term dist/goose-term
          # `dist/*` below is what the release uploads, so drop the staged
          # executable: the archive and its checksum are the assets.
          (cd dist && tar -czf "${archive}" goose-term && rm goose-term)
          # The checksum names the bare file, not the dist/ path, so a
          # downloader can run it beside the two files.
          if command -v sha256sum > /dev/null 2>&1; then
            (cd dist && sha256sum "${archive}" > "${archive}.sha256")
          else
            (cd dist && shasum -a 256 "${archive}" > "${archive}.sha256")
          fi

      - name: Upload the packaged asset
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish the GitHub Release
    needs: build
    runs-on: ubuntu-22.04
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Download every platform's assets
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create or update the GitHub Release
        shell: bash
        run: |
          set -euo pipefail
          ls -l dist
          tag="${GITHUB_REF_NAME}"
          if gh release view "${tag}" --repo "${GITHUB_REPOSITORY}" > /dev/null 2>&1; then
            gh release upload "${tag}" dist/* --repo "${GITHUB_REPOSITORY}" --clobber
          else
            gh release create "${tag}" dist/* --repo "${GITHUB_REPOSITORY}" \
              --title "${tag}" --generate-notes
          fi
